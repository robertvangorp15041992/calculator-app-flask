<!DOCTYPE html>
<html>
<head>
    <title>Results</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .container { padding: 20px; border: 1px solid #ccc; border-radius: 10px; display: inline-block; text-align: left; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 5px 0; }
    </style>
</head>
<body>
    <h1>Calculation Results</h1>
    <div class="container">
        <p><strong>Calculated Airflow:</strong> {{ airflow|round(2) }} m³/min</p>
        <h3>Recommended Precleaners:</h3>
        <ul>
            {% for precleaner in suitable_precleaners %}
                <li>{{ precleaner.model }}</li>
            {% endfor %}
        </ul>
    </div>
    <br>
    <a href="/">Go Back</a>
</body>
</html>
